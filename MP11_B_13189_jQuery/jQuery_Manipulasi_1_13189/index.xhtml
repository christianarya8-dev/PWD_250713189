<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" 
    xml:lang="id" lang="id">
<head>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            type="text/javascript"></script>
    <style type="text/css">
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        .highlight {
            background-color: lightyellow;
            padding: 10px;
        }
        button {
            margin: 5px;
            padding: 8px 15px;
        }
    </style>
    <script type="text/javascript">
        $(document).ready(function() {
            $("#btnWarna").click(function() {
                $("#judul").css("color", "green");
            });

            $("#btnHighlight").click(function() {
                $("#deskripsi").addClass("highlight");
            });
        });
    </script>
</head>
<body>

    <h2 id="judul">Toko Online Mahasiswa</h2>
    <p id="deskripsi"> Temukan berbagai produk menarik dengan harga terjangkau.</p>
    <button id="btnWarna">Ubah Warna Judul</button>
    <button id="btnHighlight">Tambahkan Highlight</button>
</body>
</html>
